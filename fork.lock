# What the kit's binaries are built from. The build workflow reads this file, so changing a line here and
# running the workflow is how the binaries are updated. Nothing else decides what gets built.
#
# FORK_COMMIT must be on FORK_REPO on GitHub: the workflow checks it out by commit, not by branch, so a
# build always says exactly what it came from.
FORK_REPO=krisfoster/ccusage
FORK_COMMIT=eeeb8a467d06dc8635237a5f5fbab7befac0fb76
# Prices are compiled into the binary, so the file they come from is pinned too. (Two builds of one commit were not
# byte-identical, so what the kit trusts is the checksum of a particular release, not the commit.)
PRICES_REPO=BerriAI/litellm
PRICES_COMMIT=5390199d637e78324e6a0181faa0e31fb44ec053
