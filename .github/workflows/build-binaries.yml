name: Build and publish ccusage binaries

# Builds the ccusage binaries this project installs, from the commit named in fork.lock: static Linux ones (the
# sandboxes, and Linux hosts) and macOS ones (macOS hosts), and publishes them as a GitHub release with a checksum file and a build provenance attestation. Run it by hand;
# nothing here fires on its own. Afterwards run scripts/pin-release.sh <tag> and commit what it changes:
# that is what makes the kit install these exact bytes.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for the release (default: binaries-<first 8 of the fork commit>)"
        required: false
        type: string

permissions: {}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { arch: x64, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read fork.lock
        run: |
          grep -E '^[A-Z_]+=[A-Za-z0-9/._-]+$' fork.lock >> "$GITHUB_ENV"
          for v in FORK_REPO FORK_COMMIT PRICES_REPO PRICES_COMMIT; do
            grep -q "^$v=" fork.lock || { echo "fork.lock has no $v" >&2; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.FORK_COMMIT }}
          path: fork
          persist-credentials: false

      - name: Fetch the pinned model prices
        run: |
          mkdir -p "$RUNNER_TEMP/cache"
          curl -fsSL -o "$RUNNER_TEMP/cache/model_prices.json" \
            "https://raw.githubusercontent.com/${PRICES_REPO}/${PRICES_COMMIT}/model_prices_and_context_window.json"
          sha256sum "$RUNNER_TEMP/cache/model_prices.json"

      - name: Build
        env:
          OUT: ${{ runner.temp }}/out
          SKIP_METADATA: "1"
          CCUSAGE_SBX_BUILD_CACHE: ${{ runner.temp }}/cache
        run: scripts/build-binaries.sh fork ${{ matrix.arch }}

      - name: Smoke test
        run: |
          "$RUNNER_TEMP/out/ccusage-linux-${{ matrix.arch }}" --version
          "$RUNNER_TEMP/out/ccusage-linux-${{ matrix.arch }}" sync --help >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccusage-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/ccusage-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  build-host:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read fork.lock
        run: |
          grep -E '^[A-Z_]+=[A-Za-z0-9/._-]+$' fork.lock >> "$GITHUB_ENV"
          for v in FORK_REPO FORK_COMMIT PRICES_REPO PRICES_COMMIT; do
            grep -q "^$v=" fork.lock || { echo "fork.lock has no $v" >&2; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.FORK_REPO }}
          ref: ${{ env.FORK_COMMIT }}
          path: fork
          persist-credentials: false

      - name: Fetch the pinned model prices
        run: |
          mkdir -p "$RUNNER_TEMP/cache"
          curl -fsSL -o "$RUNNER_TEMP/cache/model_prices.json" \
            "https://raw.githubusercontent.com/${PRICES_REPO}/${PRICES_COMMIT}/model_prices_and_context_window.json"
          shasum -a 256 "$RUNNER_TEMP/cache/model_prices.json"

      - name: Build
        env:
          CCUSAGE_SBX_BIN: ${{ runner.temp }}/out/ccusage-${{ matrix.target }}
          CCUSAGE_SBX_BUILD_CACHE: ${{ runner.temp }}/cache
        run: scripts/build-host-binary.sh fork

      - name: Smoke test
        run: |
          "$RUNNER_TEMP/out/ccusage-${{ matrix.target }}" --version
          "$RUNNER_TEMP/out/ccusage-${{ matrix.target }}" sync serve --help >/dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccusage-${{ matrix.target }}
          path: ${{ runner.temp }}/out/ccusage-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build, build-host]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read fork.lock
        run: grep -E '^[A-Z_]+=[A-Za-z0-9/._-]+$' fork.lock >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and build info
        run: |
          cd dist
          chmod +x ccusage-linux-*
          sha256sum ccusage-linux-arm64 ccusage-linux-x64 ccusage-darwin-arm64 ccusage-darwin-x64 > SHA256SUMS
          cat > BUILD-INFO <<INFO
          ccusage fork:  https://github.com/${FORK_REPO}
          commit:        ${FORK_COMMIT}
          prices:        https://github.com/${PRICES_REPO}/blob/${PRICES_COMMIT}/model_prices_and_context_window.json
          toolchain:     Linux: rust:1.97-alpine (static musl); macOS: the fork's rust-toolchain.toml on the runner
          kit commit:    ${GITHUB_SHA}
          workflow run:  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          INFO
          cat SHA256SUMS BUILD-INFO

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ccusage-linux-arm64
            dist/ccusage-linux-x64
            dist/ccusage-darwin-arm64
            dist/ccusage-darwin-x64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-binaries-${FORK_COMMIT:0:8}}"
          case "$tag" in *[!A-Za-z0-9._-]*|"") echo "bad tag '$tag'" >&2; exit 1 ;; esac
          gh release create "$tag" dist/ccusage-linux-arm64 dist/ccusage-linux-x64 dist/ccusage-darwin-arm64 dist/ccusage-darwin-x64 dist/SHA256SUMS dist/BUILD-INFO \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ccusage binaries $tag" \
            --notes "Binaries of the ccusage fork (static Linux for sandboxes and Linux hosts, macOS for macOS hosts) at ${FORK_REPO}@${FORK_COMMIT}. Pin them with scripts/pin-release.sh $tag. See BUILD-INFO and SHA256SUMS."
          echo "Released $tag. Next: scripts/pin-release.sh $tag" >> "$GITHUB_STEP_SUMMARY"
